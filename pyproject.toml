[project]
name = "mcp-office"
version = "0.1.0"
description = "MCP server for Office document manipulation (Word, Excel, PowerPoint)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-docx>=1.2.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.25.0",
    "docx2pdf>=0.1.8",
    "mcp>=1.1.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.9",
    "pandas>=3.0.1",
    "reportlab>=4.4.10",
    "img2pdf>=0.6.3",
]

[project.scripts]
mcp-office = "mcp_office.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]
